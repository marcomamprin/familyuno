<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family UNO</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#111827}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#273449,#0b1020 60%);overflow-x:hidden}
button,input,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;font-size:26px}.badge{font-size:13px;padding:7px 11px;border-radius:999px;background:#ffffff14}
.panel{background:#ffffff0d;border:1px solid #ffffff18;border-radius:24px;padding:22px;backdrop-filter:blur(14px);box-shadow:0 20px 60px #0004}
.lobby{max-width:620px;margin:8vh auto}.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:46px;margin:0 0 8px}.hero p{color:#c7d0df;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;color:#b8c2d3}.field input,.field select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid #ffffff22;background:#101827;color:#fff;outline:none}
button{border:0;border-radius:14px;padding:12px 16px;background:#fff;color:#111827;font-weight:800;cursor:pointer}.primary{background:#ffd83d}.danger{background:#ff5a67;color:#fff}.secondary{background:#ffffff14;color:#fff;border:1px solid #ffffff18}
.error{color:#ff9ba3;background:#ff4d5b14;padding:10px 12px;border-radius:12px;margin-top:10px}.hint{font-size:13px;color:#9da9bb;line-height:1.5}
.room{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#ffffff0b;border:1px solid #ffffff14;border-radius:16px;padding:14px;margin:10px 0}
.roomcode{font-size:24px;font-weight:900;letter-spacing:5px}.players{display:flex;flex-wrap:wrap;gap:8px}.player{padding:8px 11px;border-radius:999px;background:#ffffff12;font-size:13px}.player.me{outline:2px solid #ffd83d}
.game{display:none}.table{min-height:410px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}.opponents{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.opponent{min-width:130px;text-align:center;padding:10px;border-radius:16px;background:#ffffff0b}.count{font-size:12px;color:#aeb8c9}.center{display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap}.pile{display:grid;justify-items:center;gap:8px}.pile-label{font-size:12px;color:#9da9bb}.card{width:88px;height:126px;border-radius:14px;border:5px solid #fff;display:grid;place-items:center;color:#fff;font-weight:950;box-shadow:0 10px 24px #0005;position:relative;overflow:hidden;cursor:pointer}.card:before{content:"";position:absolute;width:70px;height:105px;border-radius:50%;background:#fff4;transform:rotate(-25deg)}.card span{position:relative;text-shadow:0 2px 3px #0006;font-size:24px}.red{background:#ed3340}.yellow{background:#f5c400;color:#1a1a1a}.green{background:#21a957}.blue{background:#2d73e6}.wild{background:conic-gradient(#ed3340 0 25%,#f5c400 25% 50%,#21a957 50% 75%,#2d73e6 75%)}.back{background:linear-gradient(135deg,#222,#050505);border-color:#ffd83d}.hand{display:flex;justify-content:center;align-items:end;gap:8px;overflow-x:auto;padding:12px 2px 8px}.hand .card{flex:0 0 auto;width:70px;height:102px}.hand .card span{font-size:18px}.hand .card:hover{transform:translateY(-10px)}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.turn{font-weight:900;text-align:center;color:#ffd83d}.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal{max-width:420px;width:100%;background:#182235;border:1px solid #ffffff22;border-radius:24px;padding:22px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.colors button{color:#fff}.mini{font-size:12px;color:#9da9bb}.win{font-size:32px;font-weight:950;text-align:center}
@media(max-width:650px){.hero h1{font-size:38px}.wrap{padding:12px}.panel{padding:16px}.table{min-height:520px}.card{width:74px;height:108px}.hand .card{width:62px;height:92px}.top{align-items:flex-start}.roomcode{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">🃏 Family UNO</div><div id="statusBadge" class="badge">Private</div></div>
  <section id="lobby" class="panel lobby">
    <div class="hero"><h1>UNO, together.</h1><p>Private rooms for family & friends · 2–4 players</p></div>
    <div class="tabs"><button id="newTab" class="primary">Create game</button><button id="joinTab" class="secondary">Join game</button></div>
    <div id="createBox">
      <div class="field"><label>Your name</label><input id="createName" maxlength="30" placeholder="Marco"></div>
      <div class="field"><label>Players</label><select id="maxPlayers"><option value="2">2 players</option><option value="3">3 players</option><option value="4" selected>4 players</option></select></div>
      <button class="primary" style="width:100%" id="createBtn">Create private room</button>
    </div>
    <div id="joinBox" style="display:none">
      <div class="field"><label>Your name</label><input id="joinName" maxlength="30" placeholder="Mamma"></div>
      <div class="field"><label>Room code</label><input id="roomCode" maxlength="6" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:5px;font-weight:900"></div>
      <button class="primary" style="width:100%" id="joinBtn">Join room</button>
    </div>
    <div id="err" class="error" style="display:none"></div>
    <p class="hint">Your cards stay private. The backend validates moves; other players only see card counts.</p>
  </section>

  <section id="game" class="game">
    <div class="panel" style="margin-bottom:14px">
      <div class="room"><div><div class="mini">ROOM</div><div id="roomCodeDisplay" class="roomcode">------</div></div><button class="secondary" id="copyBtn">Copy invite</button></div>
      <div id="players" class="players"></div>
      <div id="waiting" style="margin-top:14px;display:none"><div class="hint">Waiting for players…</div><button id="startBtn" class="primary" style="margin-top:10px">Start game</button></div>
    </div>
    <div class="panel table">
      <div id="opponents" class="opponents"></div>
      <div class="center">
        <div class="pile"><div class="pile-label">DRAW</div><div class="card back"><span>UNO</span></div></div>
        <div class="pile"><div class="pile-label">DISCARD</div><div id="topCard" class="card blue"><span>?</span></div></div>
      </div>
      <div>
        <div id="turn" class="turn"></div>
        <div id="hand" class="hand"></div>
        <div class="actions"><button id="drawBtn" class="primary">Draw card</button><button id="unoBtn" class="danger">UNO!</button><button id="leaveBtn" class="secondary">Leave</button></div>
      </div>
    </div>
  </section>
</div>
<div id="overlay" class="overlay"><div class="modal"><div class="win">Choose a color</div><div class="colors"><button class="red" data-color="red">Red</button><button class="yellow" data-color="yellow">Yellow</button><button class="green" data-color="green">Green</button><button class="blue" data-color="blue">Blue</button></div><button id="closeModal" class="secondary" style="width:100%;margin-top:12px">Cancel</button></div></div>
<script>
const API="https://lakkufojduscksomenbp.supabase.co/functions/v1/uno-api-v2";
let token=localStorage.getItem("uno_session"), room="", poll=null, current=null, pendingWild=null, unoCalled=false;
const $=id=>document.getElementById(id);
function err(s){$("err").textContent=s;$("err").style.display=s?"block":"none"}
function call(op,extra={}){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,session_token:token,...extra})}).then(r=>r.json()).then(x=>{if(x.error)throw Error(x.error);return x})}
function showGame(){ $("lobby").style.display="none"; $("game").style.display="block"; }
function cardText(c){return ({skip:"↪",reverse:"↔",draw2:"+2",wild:"★",wild4:"+4"})[c.value]??c.value}
function cardEl(c,click){const d=document.createElement("button");d.className="card "+(c.color==="wild"?"wild":c.color);d.innerHTML="<span>"+cardText(c)+"</span>";if(click)d.onclick=click;return d}
function render(s){
 current=s; showGame(); room=s.game.room_code; $("roomCodeDisplay").textContent=room;
 $("players").innerHTML=s.players.map(p=>`<div class="player ${p.id===s.players.find(x=>x.seat===s.players[0].seat)?.id&&p.id===s.players[0].id?"":""}">${p.name} · ${p.card_count??"? cards"} ${p.connected?"":"· offline"}</div>`).join("");
 const me=s.players.find(p=>p.seat===s.players.find(x=>x.id===s.players[0].id)?.seat);
 const mySeat=s.players.find(p=>p.card_count===s.hand.length)?.seat;
 $("opponents").innerHTML=s.players.filter(p=>p.id!==s.you.id).map(p=>`<div class="opponent"><b>${p.name}</b><div class="count">${p.card_count??"?"} cards ${p.connected?"":"· offline"}</div></div>`).join("");
 const tc=s.game.top_card; $("topCard").className="card "+(tc.color==="wild"?"wild":tc.color); $("topCard").querySelector("span").textContent=cardText(tc);
 $("turn").textContent=s.game.status==="finished" ? "🏆 Game over" : (s.game.current_seat===s.you.seat ? "Your turn" : `Waiting for ${s.players.find(p=>p.seat===s.game.current_seat)?.name||"player"}…`);
 $("hand").innerHTML=""; s.hand.forEach(c=>$("hand").appendChild(cardEl(c,()=>playCard(c))));
 $("drawBtn").disabled=s.game.current_seat!==s.you.seat || s.game.status!=="playing";
 $("waiting").style.display=s.game.status==="waiting"?"block":"none"; $("startBtn").style.display=s.players.length>0&&s.players[0].card_count===0?"block":"none";
 if(s.game.status==="finished") $("turn").textContent="🏆 "+(s.players.find(p=>p.id===s.game.winner_player_id)?.name||"Someone")+" wins!";
}
async function refresh(){try{render(await call("state"))}catch(e){console.warn(e.message)}}
async function playCard(c){if(!current)return; if(current.game.current_seat!==current.you.seat)return; if(c.color==="wild"){pendingWild=c;$("overlay").style.display="flex";return} try{await call("play",{card_id:c.id});unoCalled=false;await refresh()}catch(e){err(e.message)}}
$("newTab").onclick=()=>{$("createBox").style.display="block";$("joinBox").style.display="none"}
$("joinTab").onclick=()=>{$("createBox").style.display="none";$("joinBox").style.display="block"}
$("createBtn").onclick=async()=>{try{err("");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"create",name:$("createName").value,max_players:+$("maxPlayers").value})}).then(r=>r.json());if(r.error)throw Error(r.error);token=r.session_token;localStorage.setItem("uno_session",token);room=r.room_code;await refresh();startPolling()}catch(e){err(e.message)}}
$("joinBtn").onclick=async()=>{try{err("");const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"join",name:$("joinName").value,room_code:$("roomCode").value})}).then(r=>r.json());if(r.error)throw Error(r.error);token=r.session_token;localStorage.setItem("uno_session",token);await refresh();startPolling()}catch(e){err(e.message)}}
$("startBtn").onclick=async()=>{try{await call("start");await refresh()}catch(e){err(e.message)}}
$("drawBtn").onclick=async()=>{try{await call("draw");await refresh()}catch(e){err(e.message)}}
$("unoBtn").onclick=async()=>{try{await call("uno");unoCalled=true;$("unoBtn").textContent="UNO! ✓";await refresh();setTimeout(()=>$("unoBtn").textContent="UNO!",1200)}catch(e){err(e.message)}}
$("copyBtn").onclick=async()=>{await navigator.clipboard.writeText(location.href+"?room="+room);$("copyBtn").textContent="Copied ✓";setTimeout(()=>$("copyBtn").textContent="Copy invite",1200)}
$("leaveBtn").onclick=()=>{localStorage.removeItem("uno_session");location.reload()}
document.querySelectorAll("[data-color]").forEach(b=>b.onclick=async()=>{try{$("overlay").style.display="none";await call("play",{card_id:pendingWild.id,chosen_color:b.dataset.color});pendingWild=null;unoCalled=false;await refresh()}catch(e){err(e.message)}});
$("closeModal").onclick=()=>{$("overlay").style.display="none";pendingWild=null}
function startPolling(){if(poll)clearInterval(poll);poll=setInterval(refresh,1200)}
if(token){refresh();startPolling()}
const params=new URLSearchParams(location.search); if(params.get("room")){$("roomCode").value=params.get("room").toUpperCase();$("newTab").click();$("joinTab").click()}
</script>
</body></html>
